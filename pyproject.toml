[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-live-pool-pipelines"
version = "0.1.0"
description = "Live-pool rotation pipelines for crypto strategy runtime compatibility."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@59469a16b4ff7c5a1055caab21a1bd7a21dc0ea5",
  "pandas==3.1.0",
  "numpy==2.4.6",
  "requests==2.34.2",
  "matplotlib==3.11.2",
  "PyYAML==6.0.3",
  "lightgbm==4.7.0",
  "scikit-learn==1.9.1",
  "scipy==1.17.1",
  "joblib==1.6.0",
  "google-cloud-storage==3.17.1",
  "google-cloud-firestore==2.34.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
