[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-live-pool-pipelines"
version = "0.1.0"
description = "Live-pool rotation pipelines for crypto strategy runtime compatibility."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@1e5ecacd3843691fe1a82e620ab00e72794c0407",
  "pandas==3.0.3",
  "numpy==2.4.6",
  "requests==2.34.2",
  "matplotlib==3.11.0",
  "PyYAML==6.0.3",
  "lightgbm==4.7.0",
  "scikit-learn==1.9.0",
  "scipy==1.17.1",
  "joblib==1.5.3",
  "google-cloud-storage==3.13.1",
  "google-cloud-firestore==2.29.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
