name: Monthly Publish

"on":
  schedule:
    - cron: "15 3 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  monthly-publish:
    if: github.ref_name != 'logs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      review_issue: ${{ steps.review_issue.outputs.issue_number }}
      report_artifact: ${{ steps.monthly-report.outputs.artifact_name }}
    permissions:
      actions: write
      contents: write
      id-token: write
      issues: write
    env:
      PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED || 'true' }}
      PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'core_major' }}
      RELEASE_CHANNEL: production
      PRODUCTION_PROFILE: binance_only_core_major_monthly
      NOTIFY_LANG: ${{ vars.NOTIFY_LANG || 'zh' }}
      DOWNLOAD_TOP_LIQUID: ${{ vars.DOWNLOAD_TOP_LIQUID || '90' }}
      FIRESTORE_COLLECTION: ${{ vars.FIRESTORE_COLLECTION || 'strategy' }}
      FIRESTORE_DOCUMENT: ${{ vars.FIRESTORE_DOCUMENT || 'CRYPTO_LIVE_POOL_ROTATION_LIVE_POOL' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set Up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: "projects/677468735457/locations/global/workloadIdentityPools/github-actions/providers/github-main"
          service_account: "codex-gcp-operator@binancequant.iam.gserviceaccount.com"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          REQ_FILE="requirements-lock.txt"
          if [ ! -f "${REQ_FILE}" ]; then REQ_FILE="requirements.txt"; fi
          pip install -r "${REQ_FILE}"

      - name: Download Or Update Raw History
        run: python scripts/download_history.py --top-liquid "${DOWNLOAD_TOP_LIQUID}" --force-exchange-info

      - name: Build Production v1 Live Pool And Shadow Tracks
        run: |
          python scripts/run_monthly_shadow_build.py \
            --universe-mode "${PUBLISH_MODE}" \
            --shadow-universe-mode "${PUBLISH_MODE}" \
            --skip-publish-dry-run

      - name: Publish Production v1 Release
        run: python scripts/publish_release.py --mode "${PUBLISH_MODE}"

      - name: Write Release Status Summary
        run: python scripts/run_release_status_summary.py

      - name: Write Monthly Review Briefing
        run: python scripts/run_monthly_review_briefing.py

      - name: Write Monthly Telegram Preview
        run: python scripts/run_monthly_build_telegram.py --print-only --output-path data/output/monthly_telegram.txt

      - name: Generate Strategy Metrics
        run: |
          set -euo pipefail
          python scripts/generate_strategy_metrics.py
        env:
          STRATEGY_METRICS_REPO: ${{ github.repository }}

      - name: Assemble Monthly Report Bundle
        id: monthly-report
        run: |
          set -euo pipefail
          python scripts/run_monthly_report_bundle.py
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("data/output/monthly_report_bundle/monthly_report_bundle.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          print(f"artifact_name={payload['artifact_name']}")
          PY

      - name: Append Monthly Report Job Summary
        run: cat data/output/monthly_report_bundle/job_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Monthly Report Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.monthly-report.outputs.artifact_name }}
          path: data/output/monthly_report_bundle
          if-no-files-found: error
          retention-days: 7

      - name: Create Monthly Review Issue
        if: success() && env.PUBLISH_ENABLED != 'false'
        id: review_issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          
          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "crypto-live-pool-pipelines-monthly-publish",
          }
          api_base = f"https://api.github.com/repos/{repository}"
          label_name = "monthly-review"
          label_path = urllib.parse.quote(label_name, safe="")
          
          with open("data/output/monthly_report_bundle/monthly_report_bundle.json", "r", encoding="utf-8") as handle:
              bundle = json.load(handle)
          with open("data/output/monthly_report_bundle/ai_review_input.md", "r", encoding="utf-8") as handle:
              issue_body = handle.read()
          
          def request_json(method: str, url: str, payload: dict | None = None) -> dict:
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(request) as response:
                  body = response.read().decode("utf-8")
              return json.loads(body) if body else {}
          
          try:
              request_json("GET", f"{api_base}/labels/{label_path}")
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              request_json(
                  "POST",
                  f"{api_base}/labels",
                  {
                      "name": label_name,
                      "description": "Automated monthly report AI review",
                      "color": "0E8A16",
                  },
              )
          
          issue = request_json(
              "POST",
              f"{api_base}/issues",
              {
                  "title": f"Monthly Report Review: {bundle['as_of_date']}",
                  "labels": [label_name],
                  "body": issue_body,
              },
          )
          print(f"Created issue #{issue['number']}: {issue['html_url']}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"issue_number={issue['number']}", file=output)
              print(f"issue_url={issue['html_url']}", file=output)
          PY

      - name: Write Release Heartbeat
        if: success() && env.PUBLISH_ENABLED != 'false'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python scripts/write_release_heartbeat.py --manifest data/output/release_manifest.json --output-dir data/output/heartbeat

      - name: Push Heartbeat To Logs Branch
        if: success() && env.PUBLISH_ENABLED != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOGS_BRANCH: logs
        run: |
          set -euo pipefail
          VERSION=$(python - <<'PY'
          import json
          print(json.load(open("data/output/release_manifest.json"))["version"])
          PY
          )
          HEARTBEAT_FILE="${GITHUB_WORKSPACE}/data/output/heartbeat/monthly/${VERSION}.json"
          TMP_DIR="$(mktemp -d)"
          git clone --no-checkout "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${TMP_DIR}/logs-repo"
          cd "${TMP_DIR}/logs-repo"

          if git ls-remote --exit-code --heads origin "${LOGS_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${LOGS_BRANCH}:${LOGS_BRANCH}"
            git checkout "${LOGS_BRANCH}"
          else
            git checkout --orphan "${LOGS_BRANCH}"
            git rm -rf . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi

          mkdir -p monthly
          cp "${HEARTBEAT_FILE}" "monthly/${VERSION}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "monthly/${VERSION}.json"
          if git diff --cached --quiet; then
            echo "No heartbeat changes to commit."
            exit 0
          fi
          git commit -m "heartbeat: ${VERSION}"
          git push origin "HEAD:${LOGS_BRANCH}"

  monthly-review-preflight:
    needs: monthly-publish
    if: github.ref_name == 'main' && needs.monthly-publish.outputs.review_issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    outputs:
      ready: ${{ steps.preflight.outputs.ready }}
    steps:
      - name: Checkout review script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check existing API secrets without exposing values
        id: preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.monthly-publish.outputs.review_issue }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONTHLY_REVIEW_MAX_INPUT_TOKENS: ${{ vars.MONTHLY_REVIEW_MAX_INPUT_TOKENS || '16000' }}
          MONTHLY_REVIEW_MAX_OUTPUT_TOKENS: ${{ vars.MONTHLY_REVIEW_MAX_OUTPUT_TOKENS || '2500' }}
          MONTHLY_REVIEW_TIMEOUT_SECONDS: ${{ vars.MONTHLY_REVIEW_TIMEOUT_SECONDS || '60' }}
          MONTHLY_REVIEW_MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_REVIEW_MONTHLY_BUDGET_USD || '1.00' }}
        run: python3 scripts/run_monthly_dual_api_review.py --preflight

  monthly-dual-api-review:
    needs: [monthly-publish, monthly-review-preflight]
    if: needs.monthly-review-preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialize reservations across all runs, including manual reruns.
    concurrency:
      group: monthly-dual-api-review-budget
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
      id-token: write
    steps:
      - name: Checkout review script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download this run's published monthly materials
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.monthly-publish.outputs.report_artifact }}
          path: data/output/monthly_report_bundle
      - name: Post single-turn OpenAI and Anthropic reviews to the existing issue
        env:
          AI_SERVICE_URL: ${{ vars.AI_SERVICE_URL }}
          AI_SERVICE_AUDIENCE: ${{ vars.AI_SERVICE_AUDIENCE }}
          AI_SERVICE_PROFILE: ${{ vars.AI_SERVICE_PROFILE }}
          AI_SERVICE_MODEL: ${{ vars.AI_SERVICE_MODEL }}
          REVIEW_OWNER_LOGIN: ${{ vars.REVIEW_OWNER_LOGIN || 'Pigbibi' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.monthly-publish.outputs.review_issue }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONTHLY_REVIEW_MAX_INPUT_TOKENS: ${{ vars.MONTHLY_REVIEW_MAX_INPUT_TOKENS || '16000' }}
          MONTHLY_REVIEW_MAX_OUTPUT_TOKENS: ${{ vars.MONTHLY_REVIEW_MAX_OUTPUT_TOKENS || '2500' }}
          MONTHLY_REVIEW_TIMEOUT_SECONDS: ${{ vars.MONTHLY_REVIEW_TIMEOUT_SECONDS || '60' }}
          MONTHLY_REVIEW_MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_REVIEW_MONTHLY_BUDGET_USD || '1.00' }}
        run: python3 scripts/run_monthly_dual_api_review.py

      - name: Archive review verdict even when escalation is unavailable
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: monthly-review-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/output/monthly_review_verdict.json
          if-no-files-found: warn
          retention-days: 90
