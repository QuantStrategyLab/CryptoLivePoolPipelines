name: Monthly Publish
run-name: ${{ (github.event_name == 'schedule' || inputs.preview_only) && 'Monthly Pool Preview' || 'Monthly Publish' }}

"on":
  schedule:
    - cron: "23 3 1 * *"
    - cron: "41 3 2 * *"
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Build and validate the pool without publishing it"
        type: boolean
        default: true
      candidate_run_id:
        description: Successful main-branch preview run to approve and publish
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  monthly-slot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.slot.outputs.run }}
      version: ${{ steps.candidate.outputs.version }}
      sha256: ${{ steps.candidate.outputs.sha256 }}
    steps:
      - name: Verify the selected production pool candidate
        id: candidate
        if: github.event_name == 'workflow_dispatch' && !inputs.preview_only
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" = refs/heads/main && "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}" |
            jq -e --arg sha "$GITHUB_SHA" '
              .head_branch == "main" and .head_sha == $sha and
              .path == ".github/workflows/monthly_publish.yml" and
              .display_title == "Monthly Pool Preview" and .conclusion == "success"
            ' >/dev/null
          gh run view "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" --log |
            python3 -c '
          import datetime
          import json
          import os
          import re
          import sys

          candidates = []
          for line in sys.stdin:
              if "Validate production candidate without publishing" not in line or "{" not in line:
                  continue
              try:
                  item = json.loads(line[line.index("{"):])
              except ValueError:
                  continue
              if isinstance(item, dict) and set(item) == {"pool_candidate_version", "pool_candidate_sha256"}:
                  candidates.append(item)
          if len(candidates) != 1:
              raise SystemExit("Exactly one validated pool candidate is required")
          version = candidates[0]["pool_candidate_version"]
          digest = candidates[0]["pool_candidate_sha256"]
          if not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9_]+", version) or not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("Invalid candidate identity")
          age = (datetime.datetime.now(datetime.timezone.utc).date() - datetime.date.fromisoformat(version[:10])).days
          if not 0 <= age <= 45:
              raise SystemExit("The preview is no longer fresh")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", f"sha256={digest}", sep="\n", file=output)
          print(f"Production candidate {version} was validated.")
          '

      - name: Check the primary run before using the backup slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
          IS_BACKUP: ${{ github.event_name == 'schedule' && github.event.schedule == '41 3 2 * *' }}
        run: |
          set -euo pipefail
          if [ "$IS_BACKUP" != true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          month=$(date -u '+%Y-%m-01')
          runs=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/monthly_publish.yml/runs"             -f branch=main -f "created=>=${month}" -F per_page=100)
          if [ "$(jq -r '.total_count' <<< "$runs")" != "$(jq -r '.workflow_runs | length' <<< "$runs")" ]; then
            echo "::error::Incomplete monthly run history."
            exit 1
          fi
          previous=$(jq -r --arg self "$GITHUB_RUN_ID" '
            .workflow_runs[] | select((.id | tostring) != $self) | [.id, .status, .event, (.conclusion // "")] | @tsv' <<< "$runs")
          while IFS=$'\t' read -r prior_id status event conclusion; do
            [ -n "$prior_id" ] || continue
            if [ "$status" != completed ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            pages=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${prior_id}/jobs?filter=all&per_page=100")
            if ! jq -e 'length > 0 and (map(.total_count) | unique | length) == 1
                and ([.[].jobs[].id] | unique | length) == .[0].total_count' <<< "$pages" >/dev/null; then
              echo "::error::Incomplete prior job history."
              exit 1
            fi
            # A started publish step may have written before failing. Check
            # the production pointer manually before any retry in that case.
            if jq -e --arg event "$event" --arg conclusion "$conclusion" '[.[].jobs[].steps[]? | select((.name == "Publish Production v1 Release" and .started_at != null and .conclusion != "skipped") or
                ($event == "schedule" and $conclusion == "success" and .name == "Validate production candidate without publishing" and .conclusion == "success"))] | length > 0' <<< "$pages" >/dev/null; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "$previous"
          echo "run=true" >> "$GITHUB_OUTPUT"

  approve-publish:
    name: Approve publishing the selected pool
    needs: monthly-slot
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      github.event_name == 'workflow_dispatch' && !inputs.preview_only &&
      needs.monthly-slot.outputs.version != '' && vars.PUBLISH_ENABLED != 'false'
    environment: pool-production-approval
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Record approval
        env:
          CANDIDATE_VERSION: ${{ needs.monthly-slot.outputs.version }}
        run: printf 'Approved production pool %s.\n' "$CANDIDATE_VERSION" >> "$GITHUB_STEP_SUMMARY"

  monthly-publish:
    needs: [monthly-slot, approve-publish]
    if: >-
      !cancelled() && needs.monthly-slot.result == 'success' && needs.monthly-slot.outputs.run == 'true' &&
      ((needs.approve-publish.result == 'success' && github.event_name == 'workflow_dispatch' && !inputs.preview_only) ||
      (needs.approve-publish.result == 'skipped' && (github.event_name == 'schedule' || inputs.preview_only))) &&
      (github.ref_name == 'main' || (github.ref_name != 'logs' && inputs.preview_only))
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 60
    outputs:
      review_issue: ${{ steps.review_issue.outputs.issue_number }}
      report_artifact: ${{ steps.monthly-report.outputs.artifact_name }}
    permissions:
      actions: write
      contents: write
      id-token: write
      issues: write
    env:
      PUBLISH_ENABLED: ${{ needs.approve-publish.result == 'success' && 'true' || 'false' }}
      APPROVED_POOL_VERSION: ${{ needs.monthly-slot.outputs.version }}
      APPROVED_POOL_SHA256: ${{ needs.monthly-slot.outputs.sha256 }}
      PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'core_major' }}
      RELEASE_CHANNEL: production
      PRODUCTION_PROFILE: binance_only_core_major_monthly
      NOTIFY_LANG: ${{ vars.NOTIFY_LANG || 'zh' }}
      DOWNLOAD_TOP_LIQUID: ${{ vars.DOWNLOAD_TOP_LIQUID || '90' }}
      FIRESTORE_COLLECTION: ${{ vars.FIRESTORE_COLLECTION || 'strategy' }}
      FIRESTORE_DOCUMENT: ${{ vars.FIRESTORE_DOCUMENT || 'CRYPTO_LIVE_POOL_ROTATION_LIVE_POOL' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set Up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Authenticate to Google Cloud
        if: env.PUBLISH_ENABLED != 'false'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: "projects/677468735457/locations/global/workloadIdentityPools/github-actions/providers/github-main"
          service_account: "codex-gcp-operator@binancequant.iam.gserviceaccount.com"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          REQ_FILE="requirements-lock.txt"
          if [ ! -f "${REQ_FILE}" ]; then REQ_FILE="requirements.txt"; fi
          pip install -r "${REQ_FILE}"

      - name: Download Or Update Raw History
        run: python scripts/download_history.py --top-liquid "${DOWNLOAD_TOP_LIQUID}" --force-exchange-info

      - name: Build Production v1 Live Pool And Shadow Tracks
        run: |
          args=()
          if [ "$PUBLISH_ENABLED" = true ]; then
            args+=(--as-of-date "${APPROVED_POOL_VERSION:0:10}")
          fi
          python scripts/run_monthly_shadow_build.py "${args[@]}" \
            --universe-mode "${PUBLISH_MODE}" \
            --shadow-universe-mode "${PUBLISH_MODE}" \
            --skip-publish-dry-run

      - name: Validate production candidate without publishing
        if: env.PUBLISH_ENABLED == 'false'
        run: python scripts/publish_release.py --dry-run --summary-only --mode "${PUBLISH_MODE}"

      - name: Publish Production v1 Release
        if: env.PUBLISH_ENABLED != 'false'
        run: |
          set -euo pipefail
          python scripts/publish_release.py --mode "${PUBLISH_MODE}" \
            --expected-pool-version "$APPROVED_POOL_VERSION" --expected-pool-sha256 "$APPROVED_POOL_SHA256"

      - name: Write Release Status Summary
        run: python scripts/run_release_status_summary.py

      - name: Write Monthly Review Briefing
        run: python scripts/run_monthly_review_briefing.py

      - name: Write Monthly Telegram Preview
        run: python scripts/run_monthly_build_telegram.py --print-only --output-path data/output/monthly_telegram.txt

      - name: Generate Strategy Metrics
        run: |
          set -euo pipefail
          python scripts/generate_strategy_metrics.py
        env:
          STRATEGY_METRICS_REPO: ${{ github.repository }}

      - name: Assemble Monthly Report Bundle
        id: monthly-report
        run: |
          set -euo pipefail
          python scripts/run_monthly_report_bundle.py
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("data/output/monthly_report_bundle/monthly_report_bundle.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          print(f"artifact_name={payload['artifact_name']}")
          PY

      - name: Append Monthly Report Job Summary
        run: cat data/output/monthly_report_bundle/job_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Scan monthly report before publication
        uses: QuantStrategyLab/.github/actions/scan-before-publish@0da4da68433b803cda17d3f84e29875a94a32273 # v1
        with:
          path: data/output/monthly_report_bundle

      - name: Upload Monthly Report Artifact
        if: env.PUBLISH_ENABLED != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.monthly-report.outputs.artifact_name }}
          path: data/output/monthly_report_bundle
          if-no-files-found: error
          retention-days: 7

      - name: Create Monthly Review Issue
        if: success() && env.PUBLISH_ENABLED != 'false'
        id: review_issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          
          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "crypto-live-pool-pipelines-monthly-publish",
          }
          api_base = f"https://api.github.com/repos/{repository}"
          label_name = "monthly-review"
          label_path = urllib.parse.quote(label_name, safe="")
          
          with open("data/output/monthly_report_bundle/monthly_report_bundle.json", "r", encoding="utf-8") as handle:
              bundle = json.load(handle)
          with open("data/output/monthly_report_bundle/ai_review_input.md", "r", encoding="utf-8") as handle:
              issue_body = handle.read()
          
          def request_json(method: str, url: str, payload: dict | None = None) -> dict:
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(request) as response:
                  body = response.read().decode("utf-8")
              return json.loads(body) if body else {}
          
          try:
              request_json("GET", f"{api_base}/labels/{label_path}")
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              request_json(
                  "POST",
                  f"{api_base}/labels",
                  {
                      "name": label_name,
                      "description": "Automated monthly report AI review",
                      "color": "0E8A16",
                  },
              )
          
          issue = request_json(
              "POST",
              f"{api_base}/issues",
              {
                  "title": f"Monthly Report Review: {bundle['as_of_date']}",
                  "labels": [label_name],
                  "body": issue_body,
              },
          )
          print(f"Created issue #{issue['number']}: {issue['html_url']}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"issue_number={issue['number']}", file=output)
              print(f"issue_url={issue['html_url']}", file=output)
          PY

      - name: Write Release Heartbeat
        if: success() && env.PUBLISH_ENABLED != 'false'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python scripts/write_release_heartbeat.py --manifest data/output/release_manifest.json --output-dir data/output/heartbeat

      - name: Record last success time
        if: success() && env.PUBLISH_ENABLED != 'false'
        run: |
          printf 'Last success: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_STEP_SUMMARY"

  monthly-review-preflight:
    needs: monthly-publish
    if: github.ref_name == 'main' && needs.monthly-publish.outputs.review_issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    outputs:
      ready: ${{ steps.preflight.outputs.ready }}
    steps:
      - name: Checkout review script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check existing API secrets without exposing values
        id: preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.monthly-publish.outputs.review_issue }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONTHLY_REVIEW_MAX_INPUT_TOKENS: ${{ vars.MONTHLY_REVIEW_MAX_INPUT_TOKENS || '16000' }}
          MONTHLY_REVIEW_MAX_OUTPUT_TOKENS: ${{ vars.MONTHLY_REVIEW_MAX_OUTPUT_TOKENS || '2500' }}
          MONTHLY_REVIEW_TIMEOUT_SECONDS: ${{ vars.MONTHLY_REVIEW_TIMEOUT_SECONDS || '60' }}
          MONTHLY_REVIEW_MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_REVIEW_MONTHLY_BUDGET_USD || '1.00' }}
        run: python3 scripts/run_monthly_dual_api_review.py --preflight

  monthly-dual-api-review:
    needs: [monthly-publish, monthly-review-preflight]
    if: needs.monthly-review-preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialize reservations across all runs, including manual reruns.
    concurrency:
      group: monthly-dual-api-review-budget
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
      id-token: write
    steps:
      - name: Checkout review script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download this run's published monthly materials
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.monthly-publish.outputs.report_artifact }}
          path: data/output/monthly_report_bundle
      - name: Post single-turn OpenAI and Anthropic reviews to the existing issue
        env:
          AI_SERVICE_TARGET: quant-ai-service-v2
          AI_HOOK_MODE: shadow
          AI_SERVICE_URL: ${{ secrets[vars.AI_HOOK_URL_SECRET] }}
          AI_SERVICE_AUDIENCE: ${{ secrets[vars.AI_HOOK_AUDIENCE_SECRET] }}
          AI_SERVICE_PROFILE: ${{ secrets[vars.AI_HOOK_PROFILE_SECRET] }}
          AI_SERVICE_MODEL: ${{ secrets[vars.AI_HOOK_MODEL_SECRET] }}
          REVIEW_OWNER_LOGIN: ${{ vars.REVIEW_OWNER_LOGIN || 'Pigbibi' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.monthly-publish.outputs.review_issue }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONTHLY_REVIEW_MAX_INPUT_TOKENS: ${{ vars.MONTHLY_REVIEW_MAX_INPUT_TOKENS || '16000' }}
          MONTHLY_REVIEW_MAX_OUTPUT_TOKENS: ${{ vars.MONTHLY_REVIEW_MAX_OUTPUT_TOKENS || '2500' }}
          MONTHLY_REVIEW_TIMEOUT_SECONDS: ${{ vars.MONTHLY_REVIEW_TIMEOUT_SECONDS || '60' }}
          MONTHLY_REVIEW_MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_REVIEW_MONTHLY_BUDGET_USD || '1.00' }}
        run: python3 scripts/run_monthly_dual_api_review.py

      - name: Scan review verdict before publication
        id: scan-review-verdict
        if: always()
        uses: QuantStrategyLab/.github/actions/scan-before-publish@0da4da68433b803cda17d3f84e29875a94a32273 # v1
        with:
          path: data/output/monthly_review_verdict.json

      - name: Archive review verdict even when escalation is unavailable
        if: always() && steps.scan-review-verdict.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: monthly-review-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/output/monthly_review_verdict.json
          if-no-files-found: warn
          retention-days: 90
